<!doctype html>
<html lang="pt-BR" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CLUB 01 Barber Studio</title>
    <meta name="description" content="CLUB 01 Barber Studio — Estilo, precisão e sofisticação. Agende seu horário online com nossos profissionais de forma rápida e prática." />

    <!-- Google Fonts: Bebas Neue & Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Open Graph / WhatsApp / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CLUB 01 Barber Studio" />
    <meta property="og:description" content="Estilo, precisão e sofisticação. Agende seu horário online no CLUB 01 Barber Studio." />
    <meta property="og:image" content="/assets/logo_club01.jpeg" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CLUB 01 Barber Studio" />
    <meta name="twitter:description" content="Estilo, precisão e sofisticação. Agende seu horário online no CLUB 01 Barber Studio." />
    <meta name="twitter:image" content="/assets/logo_club01.jpeg" />

    <!-- Favicon -->
    <link rel="icon" type="image/jpeg" href="/assets/logo_club01.jpeg" />

    <!-- Immediate Theme Application Script (Prevents FOUC) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('club01_theme');
          var theme = saved === 'light' ? 'light' : 'dark';
          document.documentElement.classList.remove('dark', 'light');
          document.documentElement.classList.add(theme);
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="bg-background text-foreground font-sans antialiased min-h-screen selection:bg-foreground selection:text-background">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
