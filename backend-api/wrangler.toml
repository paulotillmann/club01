# ==============================================================================
# CLUB 01 BARBER STUDIO - CONFIGURAÇÃO LOCAL E ISOLAMENTO
# ==============================================================================
name = "club01-backend-isolated"
main = "src/index.js"
compatibility_date = "2024-04-03"

[durable_objects]
bindings = [
  { name = "APPOINTMENT_SCHEDULER", class_name = "AppointmentScheduler" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AppointmentScheduler"]

